<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Expense Tracker</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4faf6;
            color: #222;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            width: 400px;
            max-width: 90%;

            background-color: white;

            padding: 40px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #16803c;

            text-align: center;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;

            text-align: center;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #16803c;
        }

        button {
            width: 100%;

            padding: 12px;

            background-color: #16803c;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background-color: #116b31;
        }

        .errorlist {
            color: #b00020;

            list-style: none;

            margin-bottom: 10px;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;

            color: #666;
        }

        .login-link a {
            color: #16803c;

            text-decoration: none;

            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="register-container">

        <h1>Expense Tracker</h1>

        <p class="subtitle">
            Create your account
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login-link">

            <p>
                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>
            </p>

        </div>

    </div>

</body>

</html>
